# 启用的 provider 列表（按顺序使用；name 必须是被 @register 注册过的）
providers:
  # toolhelper.cn DNSCheck 接口不接 dns 参数；upstream_dns 字段对本 provider 无意义
  # （schema 保留以兼容其他可能支持多上游 DNS 的 provider）
  - name: toolhelper
    enabled: true
    upstream_dns: []
    extra:                      # provider 私有参数（透传到 ResolverConfig.extra）
      timeout: 10

# 写入目标
output:
  path: hosts.txt
  keep_old_section: true        # 是否保留 hosts.txt 中 ###start### 外的内容

# 可达性检测
reachability:
  method: http_head             # 现阶段只支持 http_head，留扩展位
  timeout: 5.0
